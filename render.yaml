services:
  - type: web
    name: wams-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wams-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: wams-postgres
    plan: free
    databaseName: wams
    ipAllowList: []
